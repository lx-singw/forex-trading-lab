[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-demo-lab"
version = "0.1.0"
description = "Offline EURUSD research; no broker execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forex-demo-lab = "forex_demo_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
